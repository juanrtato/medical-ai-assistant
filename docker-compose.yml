services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: emermedica-backend

    ports:
      - "8000:8000"

    env_file:
      - .env


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: emermedica-frontend

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend